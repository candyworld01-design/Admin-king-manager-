app = "admin-king-manager"  # Yahan apna wahi app name daal dena jo aapne banaya tha

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[processes]
  app = "python main.py"  # Agar main file ka naam kuch aur hai jaise bot.py toh yahan change kar lena
